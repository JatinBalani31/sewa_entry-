name: Deploy to Fly.io

# Runs the full test suite (via ci.yml) on every push to main, and only ships
# to production if it passes. Requires the one-time Fly.io setup in
# DEPLOY.md, plus a FLY_API_TOKEN repository secret.
on:
  push:
    branches: [main]

# Never let two deploys race each other; a second push while one is still
# rolling out waits its turn instead of deploying concurrently.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
